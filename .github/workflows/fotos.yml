name: Robot de fotos
on:
  push:
    paths: ["pedidos/**"]
  schedule:
    - cron: "17 5,17 * * *"   # ~7:17 y ~19:17 (Madrid): fotos nuevas de la tienda y rehace fondos dibujados
  workflow_dispatch:
    inputs:
      modo:
        description: "todo | tienda | pedidos | rehacer"
        default: "todo"
permissions:
  contents: write
concurrency:
  group: fotos
  cancel-in-progress: false
env:
  U2NET_HOME: /home/runner/.u2net
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet
      - run: pip install "rembg[cpu]==2.0.67" pillow requests scipy numpy
      - run: python scripts/procesar.py ${{ inputs.modo || 'todo' }}
      - name: Guardar resultados
        run: |
          git config user.name "Robot de fotos"
          git config user.email "robot@regalospeludos.shop"
          mkdir -p fondos && git add -A tienda salida fondos
          git diff --cached --quiet || git commit -m "Fotos procesadas $(date -u +%F_%H%M)"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
